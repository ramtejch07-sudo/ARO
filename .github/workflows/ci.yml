name: CI

on:
  push:
  pull_request:

jobs:
  cmake:
    name: CMake build + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (console demo, server, tests; warnings enabled)
        run: cmake --build build -j"$(nproc)"
      - name: Run unit + API tests
        run: ctest --test-dir build --output-on-failure
      - name: Run console demo
        run: ./build/ambulance_sim
      - name: Simulation smoke run (offline) + repeatability
        run: |
          ./build/aro_simulate --offline --calls 120 --repeat 2 --seed 7 --out sim_a
          ./build/aro_simulate --offline --calls 120 --repeat 2 --seed 7 --out sim_b
          diff sim_a/summary.csv sim_b/summary.csv     # same seed -> identical results
          test -s sim_a/summary.md && test -s sim_a/response_times.svg && test -s sim_a/response_times.html

  plain-gpp:
    name: Plain g++ build (no CMake) + server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build console demo
        run: g++ -std=c++17 -Wall -Wextra -Iinclude src/*.cpp -o ambulance_sim
      - name: Build server
        run: >
          g++ -std=c++17 -O2 -Iinclude -Iserver
          server/ApiServer.cpp server/ApiRoutes.cpp server/Database.cpp server/OsrmRoutingProvider.cpp
          $(ls src/*.cpp | grep -v '/main.cpp')
          -o ambulance_server -lpthread
      - name: Build simulation
        run: >
          g++ -std=c++17 -O2 -Iinclude -Iserver sim/aro_simulate.cpp server/Database.cpp server/OsrmRoutingProvider.cpp
          $(ls src/*.cpp | grep -v '/main.cpp') -o aro_simulate -lpthread
      - name: Simulation smoke run
        run: ./aro_simulate --offline --calls 80 --out sim_plain && test -s sim_plain/summary.csv
      - name: Smoke test the server
        run: |
          PORT=8099 OSRM_URL=off ./ambulance_server &
          for i in $(seq 1 20); do curl -fs http://localhost:8099/api/health && break || sleep 0.5; done
          curl -fs http://localhost:8099/api/locations
          PORT=8099 ./ambulance_server --healthcheck
          kill %1

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aro-server .
